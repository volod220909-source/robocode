<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кібер-візитка</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { background:#0f172a; color:#f8fafc; font-family:sans-serif; display:flex;
         justify-content:center; align-items:center; min-height:100vh; margin:0; }
  .card { background:#1e293b; padding:30px; border-radius:16px; text-align:center;
          width:300px; border:2px solid #00ffcc; box-shadow:0 10px 25px rgba(0,255,204,.2); }
  h1 { color:#00ffcc; font-size:24px; margin:0 0 5px; }
  p { color:#94a3b8; font-size:14px; margin-bottom:20px; }
  input { width:100%; box-sizing:border-box; padding:10px; margin:6px 0; border-radius:8px; border:0; }
  .btn { display:block; background:#00ffcc; color:#0f172a; padding:12px; border-radius:8px;
         text-decoration:none; font-weight:bold; border:0; width:100%; cursor:pointer; margin-top:10px; }
  #qr { background:#fff; padding:10px; border-radius:8px; display:inline-block; margin-top:15px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
const params = new URLSearchParams(location.search);
const card = document.getElementById("card");

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;      // textContent — безпечно, без вставки HTML
  if (cls) e.className = cls;
  return e;
}

if (params.get("n")) {
  // РЕЖИМ ВІЗИТКИ
  card.append(el("h1", params.get("n")), el("p", params.get("r") || "Учень Robocode"));
  const link = params.get("l");
  if (link && /^https?:\/\//.test(link)) {  // дозволяємо лише http(s)-посилання
    const a = el("a", "Мій проєкт / контакт", "btn");
    a.href = link;
    card.append(a);
  }
} else {
  // РЕЖИМ ФОРМИ
  card.append(el("h1", "Створи візитку"));
  const name = el("input"); name.placeholder = "Ім'я";
  const role = el("input"); role.placeholder = "Статус (Кібер-інженер...)";
  const link = el("input"); link.placeholder = "Посилання (https://...)";
  const btn = el("button", "Згенерувати QR", "btn");
  const qr = el("div"); qr.id = "qr"; qr.style.display = "none";
  card.append(name, role, link, btn, qr);

  btn.onclick = () => {
    const u = new URL(location.href.split("?")[0]);
    u.searchParams.set("n", name.value || "Кібер-Гек");
    u.searchParams.set("r", role.value);
    if (link.value) u.searchParams.set("l", link.value);
    qr.innerHTML = ""; qr.style.display = "inline-block";
    new QRCode(qr, { text: u.toString(), width: 180, height: 180 });
  };
}
</script>
</body>
</html>
